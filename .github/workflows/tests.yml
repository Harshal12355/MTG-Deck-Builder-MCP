name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: pip show mcp httpx | grep -E "^(Name|Version)"
      - name: Run tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt || {
            python - <<'PY'
          import re
          out = open("test-output.txt").read()
          for block in re.split(r"\n={20,}\n", out)[1:]:
              msg = block.strip()[-3000:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=test failure::{msg}")
          PY
            exit 1
          }
