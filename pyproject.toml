[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtg-deckbuilder-mcp"
version = "0.1.0"
description = "MCP server for Magic: The Gathering deckbuilding: Scryfall, decklist analysis, Commander Spellbook combos and EDHREC recommendations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.9,<2",  # 2.x renamed FastMCP; migrate later
    "httpx>=0.27",
]

[project.scripts]
mtg-mcp = "mtg_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_mcp"]
